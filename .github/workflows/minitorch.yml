name: Python package

on: [push]

jobs:
  build:

    # ubuntu-22.04: на ubuntu-latest (24.04) Python 3.8 в setup-python недоступен
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: [3.8]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        sudo apt-get install -y graphviz
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Test with pytest
      # Оставляй раскомментированными только модули, которые уже сделаны.
      run: |
        echo "Module 0"
        pytest tests -x -m task0_1
        pytest tests -x -m task0_2
        pytest tests -x -m task0_3
        pytest tests -x -m task0_4
        echo "Module 1"
        pytest tests -x -m task1_1
        pytest tests -x -m task1_2
        pytest tests -x -m task1_3
        pytest tests -x -m task1_4
        # echo "Module 2"
        # pytest tests -x -m task2_1
        # pytest tests -x -m task2_2
        # pytest tests -x -m task2_3
        # pytest tests -x -m task2_4
        # echo "Module 3"
        # pytest tests -x -m task3_1
        # pytest tests -x -m task3_2
        # task3_3 / task3_4 — CUDA-тесты: на раннере GitHub нет GPU, тестов 0 -> pytest падает (exit 5).
        # Их НЕ включать, проверять локально.
